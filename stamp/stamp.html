<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PDF Signer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  * { -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body { font:14px system-ui,sans-serif; background:#525659; color:#eee;
         display:flex; flex-direction:column; }

  #bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 12px;
         background:#323639; border-bottom:1px solid #1a1c1e; flex:0 0 auto; }
  #bar > * { font:inherit; padding:8px 12px; border-radius:6px; border:1px solid #555;
             background:#444; color:#eee; cursor:pointer; }
  #bar button:disabled { opacity:.4; }
  #save { background:#2d7d46; border-color:#2d7d46; font-weight:600; }
  #hint { border:0; background:none; cursor:default; opacity:.6; padding-left:0; }

  #main { flex:1; display:flex; min-height:0; }
  #viewer { flex:1; overflow:auto; padding:12px; }
  #stageBox { margin:0 auto; }
  #stage { width:900px; transform-origin:top left; display:flex;
           flex-direction:column; align-items:center; gap:16px; }
  .page { position:relative; box-shadow:0 2px 12px #0008; background:#fff; }
  .page canvas { display:block; }
  .overlay { position:absolute; inset:0; }

  .sig { position:absolute; box-sizing:border-box; border:1px dashed transparent;
         cursor:move; touch-action:none; }
  .sig.sel { border-color:#4a9eff; }
  .sig img { width:100%; height:100%; display:block; pointer-events:none; }
  .sig .h { position:absolute; right:-8px; bottom:-8px; width:16px; height:16px;
            background:#4a9eff; border:2px solid #fff; border-radius:50%;
            cursor:nwse-resize; touch-action:none; display:none; }
  .sig.sel .h { display:block; }
  .sig .x { position:absolute; top:-10px; right:-10px; width:22px; height:22px;
             display:none; padding:0; border:2px solid #fff; border-radius:50%;
             background:#d92d20; color:#fff; font:700 17px/16px system-ui; cursor:pointer; }
  .sig.sel .x { display:block; }
  @media (pointer:coarse) { .sig .h { width:26px; height:26px; right:-13px; bottom:-13px; } }

  @media (max-width:820px) {
    #hint { display:none; }
  }
</style>
</head>
<body>

<div id="bar">
  <label>📄 Open PDF<input type="file" accept="application/pdf" id="pdfIn" hidden></label>
  <select id="sigSel"></select>
  <label>＋ PNG<input type="file" accept="image/png,image/jpeg" id="sigIn" hidden multiple></label>
  <button id="sigDel" title="Remove the selected signature from the list">🗑</button>
  <button id="save" disabled>✓ Confirm &amp; Download</button>
  <span id="hint">Pick a signature, then click on the page to drop it. Drag to move, blue dot to resize.</span>
</div>

<div id="main">
  <div id="viewer"><div id="stageBox"><div id="stage"></div></div></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = s => document.querySelector(s);
const viewer = $('#viewer'), stage = $('#stage'), stageBox = $('#stageBox');
const sigSel = $('#sigSel'), saveBtn = $('#save');
let pdfBytes = null, fileName = 'signed.pdf', fitScale = 1, justDragged = false;

/* ---------- signature library ---------- */

const SIGS = {
  'Ayub Sign': 'Ayub Sign.png',
  'Latif Sign': 'Latif Sign.png',
  'Sameer Sign': 'Sameer Sign.png',
  'SE Stamp': 'SE Stamp.png',
  'STS Stamp': 'STS Stamp.jpeg',
};

const BUILTIN = Object.keys(SIGS);
Object.assign(SIGS, JSON.parse(localStorage.getItem('sigs') || '{}'));

// photo-of-paper -> transparent ink. Tune these two if a scan comes out faded or blotchy.
const PAPER = 225, INK = 95;

const prepped = {};                                  // name -> cleaned data URL
const prep = name => prepped[name] ||= new Promise(res => {
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 900 / img.naturalWidth);   // 900px is plenty for a signature
    const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, w, h);
    const id = ctx.getImageData(0, 0, w, h), p = id.data;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let i = 0; i < p.length; i += 4) {
      const lum = p[i] * .299 + p[i + 1] * .587 + p[i + 2] * .114;
      const a = Math.round(Math.max(0, Math.min(1, (PAPER - lum) / (PAPER - INK))) * (p[i + 3] / 255) * 255);
      p[i] = 18; p[i + 1] = 18; p[i + 2] = 24; p[i + 3] = a;
      if (a > 40) {
        const n = i / 4, x = n % w, y = (n / w) | 0;
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
    if (x1 < 0) { x0 = y0 = 0; x1 = w - 1; y1 = h - 1; }   // nothing found: keep as-is
    const pad = Math.round((x1 - x0) * 0.02);
    x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
    x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
    const out = document.createElement('canvas');
    out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
    ctx.putImageData(id, 0, 0);
    out.getContext('2d').drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    res(out.toDataURL('image/png'));
  };
  img.src = SIGS[name];
});

function refreshSigs() {
  const names = Object.keys(SIGS);
  sigSel.innerHTML = names.length ? names.map(n => `<option>${n}</option>`).join('')
                                  : '<option value="">— add a signature PNG —</option>';
}
refreshSigs();

$('#sigIn').onchange = async e => {
  for (const f of e.target.files) {
    SIGS[f.name.replace(/\.(png|jpe?g)$/i, '')] = await new Promise(res => {
      const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f);
    });
  }
  const user = JSON.parse(localStorage.getItem('sigs') || '{}');
  for (const f of e.target.files) user[f.name.replace(/\.(png|jpe?g)$/i, '')] = SIGS[f.name.replace(/\.(png|jpe?g)$/i, '')];
  try { localStorage.setItem('sigs', JSON.stringify(user)); } catch { /* over quota: this session only */ }
  refreshSigs();
  sigSel.value = e.target.files[0].name.replace(/\.(png|jpe?g)$/i, '');
  e.target.value = '';
};

$('#sigDel').onclick = () => {
  const n = sigSel.value;
  if (!n) return;
  if (BUILTIN.includes(n)) return alert(`"${n}" is built into this file — it will come back on reload.`);
  delete SIGS[n];
  const user = JSON.parse(localStorage.getItem('sigs') || '{}');
  delete user[n];
  localStorage.setItem('sigs', JSON.stringify(user));
  refreshSigs();
};

/* ---------- load + render ---------- */
$('#pdfIn').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  fileName = f.name.replace(/\.pdf$/i, '') + '-signed.pdf';
  await loadPdf(await f.arrayBuffer());
};

async function loadPdf(buf) {
  pdfBytes = buf;
  stage.innerHTML = '';
  const doc = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;  // pdf.js detaches the buffer
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const vp = page.getViewport({ scale: 900 / page.getViewport({ scale: 1 }).width });
    const wrap = document.createElement('div');
    wrap.className = 'page';
    wrap.innerHTML = '<canvas></canvas><div class="overlay"></div>';
    const cv = wrap.querySelector('canvas');
    cv.width = Math.floor(vp.width * dpr); cv.height = Math.floor(vp.height * dpr);
    cv.style.width = vp.width + 'px'; cv.style.height = vp.height + 'px';
    stage.appendChild(wrap);
    fit();
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp,
                        transform: [dpr, 0, 0, dpr, 0, 0] }).promise;
    wrap.querySelector('.overlay').onclick = ev => {   // click, not pointerdown: touch scroll must not place
      // a drag that ends outside the box still fires a click on the overlay - not a placement tap
      if (justDragged || ev.target.closest('.sig')) return;
      place(ev.currentTarget, ev.clientX, ev.clientY);
    };
  }
  fit();
  saveBtn.disabled = false;
  sync();
}

// pages are laid out at a fixed 900px and scaled to fit; every rect stays proportional,
// so placement math and drags keep working at any screen size without re-rendering.
function fit() {
  fitScale = Math.min(1, (viewer.clientWidth - 24) / 900);
  stage.style.transform = `scale(${fitScale})`;
  stageBox.style.width = 900 * fitScale + 'px';
  stageBox.style.height = stage.scrollHeight * fitScale + 'px';
}
addEventListener('resize', fit);

/* ---------- place / move / resize ---------- */
async function place(overlay, clientX, clientY) {
  const name = sigSel.value;
  if (!name) return alert('Add a signature PNG first (the ＋ PNG button).');
  const src = await prep(name);
  const o = overlay.getBoundingClientRect();
  const box = document.createElement('div');
  box.className = 'sig';
  box.dataset.name = name;
  box.innerHTML = `<img src="${src}"><button class="x" title="Remove image">×</button><div class="h"></div>`;
  const img = box.querySelector('img');
  img.onload = () => {
    const w = 900 * 0.25, h = w * img.naturalHeight / img.naturalWidth;   // 25% of page width
    box.style.width = w + 'px'; box.style.height = h + 'px';
    box.style.left = clamp((clientX - o.left) / fitScale - w / 2, 0, 900 - w) + 'px';
    box.style.top = clamp((clientY - o.top) / fitScale - h / 2, 0, o.height / fitScale - h) + 'px';
    select(box);
  };
  overlay.appendChild(box);
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

stage.addEventListener('pointerdown', e => {
  const box = e.target.closest('.sig');
  if (!box) return;
  if (e.target.classList.contains('x')) { box.remove(); return; }
  select(box);
  e.preventDefault();
  justDragged = true;
  const resize = e.target.classList.contains('h');
  const start = { x: e.clientX, y: e.clientY, l: box.offsetLeft, t: box.offsetTop, w: box.offsetWidth };
  const ratio = box.offsetHeight / box.offsetWidth;
  const move = m => {
    const dx = (m.clientX - start.x) / fitScale, dy = (m.clientY - start.y) / fitScale;
    if (resize) {
      const w = Math.max(20, start.w + dx);
      box.style.width = w + 'px'; box.style.height = w * ratio + 'px';
      $('#sz').value = Math.round(w / 9); $('#szVal').textContent = Math.round(w / 9) + '%';
    } else {
      box.style.left = start.l + dx + 'px';
      box.style.top = start.t + dy + 'px';
    }
  };
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up);
    setTimeout(() => justDragged = false);   // clears after the browser's trailing click
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});

/* ---------- selection ---------- */
const boxes = () => [...stage.querySelectorAll('.sig')];
const selected = () => stage.querySelector('.sig.sel');

function select(box) {
  boxes().forEach(b => b.classList.toggle('sel', b === box));
}

function sync() { /* kept for existing placement calls; no layer pane is shown */ }

addEventListener('keydown', e => {                     // nudge / delete the selected layer
  const box = selected();
  if (!box || /INPUT|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { box.remove(); sync(); return; }
  const step = e.shiftKey ? 10 : 1;
  const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (!d) return;
  e.preventDefault();
  box.style.left = box.offsetLeft + d[0] + 'px';
  box.style.top = box.offsetTop + d[1] + 'px';
});

/* ---------- embed + download ---------- */
// screen rect (inside overlay o) -> pdf coords, which start at the bottom-left
function toPdf(r, o, pw, ph) {
  const h = r.height / o.height * ph;
  return {
    x: (r.left - o.left) / o.width * pw,
    y: ph - (r.top - o.top) / o.height * ph - h,
    width: r.width / o.width * pw,
    height: h,
  };
}

saveBtn.onclick = async () => {
  saveBtn.disabled = true; saveBtn.textContent = 'Embedding…';
  try {
    const doc = await PDFLib.PDFDocument.load(pdfBytes);
    const embedded = {};
    const pages = [...stage.querySelectorAll('.page')];
    for (let i = 0; i < pages.length; i++) {
      const overlay = pages[i].querySelector('.overlay');
      const page = doc.getPages()[i];
      const { width: pw, height: ph } = page.getSize();
      const o = overlay.getBoundingClientRect();
      for (const box of overlay.querySelectorAll('.sig')) {   // DOM order == layer order
        if (box.style.visibility === 'hidden') continue;
        const src = box.querySelector('img').src;
        embedded[src] ||= await doc.embedPng(src);
        page.drawImage(embedded[src], {
          ...toPdf(box.getBoundingClientRect(), o, pw, ph),
          opacity: +(box.style.opacity || 1),
        });
      }
    }
    const blob = new Blob([await doc.save()], { type: 'application/pdf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = fileName; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);      // iOS needs the url to outlive the click
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = '✓ Confirm & Download';
  }
};
// ponytail: assumes unrotated pages (/Rotate 0), and no layer rotation. Add a rotate control +
// pdf-lib's `rotate`/origin handling together if a crooked scan ever needs a tilted signature.

/* open with ?selftest to check the placement math */
if (location.search === '?selftest') {
  const got = toPdf({ left: 300, top: 600, width: 90, height: 90 },
                    { left: 0, top: 0, width: 900, height: 1200 }, 600, 800);
  const want = { x: 200, y: 340, width: 60, height: 60 };
  const pass = JSON.stringify(got) === JSON.stringify(want);
  document.body.innerHTML = `<h2 style="padding:20px">selftest ${pass ? 'PASS' : 'FAIL'}</h2>
    <pre style="padding:20px">got  ${JSON.stringify(got)}\nwant ${JSON.stringify(want)}</pre>`;
}
</script>
</body>
</html>
