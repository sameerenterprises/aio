<div id="productInfoPreview" style="font-weight:bold;color:green;margin-top:5px"></div>

<button onclick="generateImprovedPDF()">Generate PDF</button>
<div id="savedBills" style="margin-top:20px"><h3>Saved Bills</h3><ul id="billList" style="list-style:none;padding:0"></ul></div>

let customProducts={},total=0,history=[],billNumber=0;

function generateBillNumber(){
const lastBillNumber=parseInt(localStorage.getItem("lastBillNumber")||"0",10);
const newBillNumber=lastBillNumber+1;
localStorage.setItem("lastBillNumber",newBillNumber);
billNumber=newBillNumber;
document.getElementById("billNumberDisplay").textContent=`Bill Number: ${String(billNumber).padStart(4,"0")}`;
}

function showNextBillNumber(){
const lastBillNumber=parseInt(localStorage.getItem("lastBillNumber")||"0",10);
document.getElementById("billNumberDisplay").textContent=`Bill Number: ${String(lastBillNumber+1).padStart(4,"0")}`;
}

function getActualCostPrice(productDetails){
const costPrice=parseFloat(productDetails[4])||0,gstPercentage=parseFloat(productDetails[3])||0;
return document.getElementById("gstMode").checked?costPrice:costPrice+(costPrice*gstPercentage/100);
}

function recalculateAllMargins(){
history.forEach(item=>{
const productDetails=products[item.code]||customProducts[item.code];
if(!productDetails||["cgst","sgst","igst","roff"].includes(item.code))return;
const costPrice=parseFloat(productDetails[4])||0;
if(costPrice>0){
const actualCostPrice=getActualCostPrice(productDetails),sellingPrice=parseFloat(item.newpricePerUnit)||0,marginPerUnit=sellingPrice-actualCostPrice;
item.margin=parseFloat((marginPerUnit*item.quantity).toFixed(2));
item.marginPercentage=actualCostPrice>0?parseFloat(((marginPerUnit/actualCostPrice)*100).toFixed(2)):0;
item.marginDisplay=`₹${item.margin} (${item.marginPercentage}%)`;
item.marginClass=item.margin>=0?"margin-positive":"margin-negative";
}else{
item.margin=0;item.marginPercentage=0;item.marginDisplay="";item.marginClass="";
}});
renderTable();
}

document.getElementById("gstMode").addEventListener("change",recalculateAllMargins);

function addProduct(){
const input=document.getElementById("productInput").value.trim().replace(/ /g,"*");
if(input==="c"){clearAll();return;}
if(input.startsWith("*")){
const customProductName=input.slice(1);
if(customProductName){
customProducts[customProductName]=[customProductName,"nos",0,0,0,0];
alert(`Custom product "${customProductName}" added. Now enter quantity and rate in the format: quantity*${customProductName}*rate`);
}
clearInput();return;
}

const [productCode,quantityStr,amountStr]=input.split("*");
const quantity=quantityStr?parseFloat(parseFloat(quantityStr).toFixed(2)):1;
let amount=0,isInclusiveGST=false;

if(amountStr){
if(amountStr.toLowerCase().endsWith("i")){
isInclusiveGST=true;amount=parseFloat(amountStr.slice(0,-1));
}else amount=parseFloat(amountStr);
if(!isNaN(amount))amount=parseFloat(amount.toFixed(2));else amount=0;
}

const productDetails=products[productCode]||customProducts[productCode];
if(!productDetails){alert("Invalid product code!");clearInput();return;}
if(quantity===0){removeProduct(productCode);clearInput();return;}

const productName=productDetails[0];
let pricePerUnit;

if(amount===0)pricePerUnit=productDetails[2];
else if(isInclusiveGST){
const gst=productDetails[3];
pricePerUnit=parseFloat((amount/(1+gst/100)).toFixed(2));
}else pricePerUnit=amount;

const unit=productDetails[1],costPrice=productDetails[4],gstPercentage=productDetails[3];
const weightPerUnit=parseFloat(productDetails[5])||0;
const totalWeight=parseFloat((quantity*weightPerUnit).toFixed(2));

// Bundle size is stored at productDetails[6].
// Example: bundle = 40, quantity = 87 -> "2 bundle (7 nos)"
const bundleSize=parseFloat(productDetails[6])||0;

let displayQuantity;

displayQuantity=quantity==1&&unit===""?"":`${quantity} ${unit}`;

if(bundleSize>0 && unit==="nos" && displayQuantity!==""){
    const fullBundles=Math.floor(quantity/bundleSize);
    const remainingNos=parseFloat((quantity%bundleSize).toFixed(2));

    if(fullBundles>0){
        displayQuantity+=` (${fullBundles}b${remainingNos>0?` ${remainingNos}n`:""})`;
    }
}

if(weightPerUnit>0&&displayQuantity!=="")displayQuantity+=` (${totalWeight} kg)`;

const newpricePerUnit=quantity==1&&unit===""?"":`${pricePerUnit}`;
const finalAmount=parseFloat((quantity*pricePerUnit).toFixed(2));

let margin=0,marginPercentage=0,marginDisplay="";
if(costPrice>0){
const sellingPrice=amount===0?productDetails[2]:pricePerUnit;
const actualCostPrice=getActualCostPrice(productDetails);
const marginPerUnit=sellingPrice-actualCostPrice;
margin=parseFloat((marginPerUnit*quantity).toFixed(2));
marginPercentage=actualCostPrice>0?parseFloat(((marginPerUnit/actualCostPrice)*100).toFixed(2)):0;
marginDisplay=`₹${margin} (${marginPercentage}%)`;
}

let calculatedAmount=finalAmount;

if(productCode==="cgst"||productCode==="sgst"){
let gstTotal=0;
history.forEach(item=>{
const prod=products[item.code];
if(prod&&prod[3])gstTotal+=(item.finalAmount*prod[3])/100;
});
calculatedAmount=parseFloat((gstTotal/2).toFixed(2));
}else if(productCode==="igst"){
let gstTotal=0;
history.forEach(item=>{
const prod=products[item.code];
if(prod&&prod[3])gstTotal+=(item.finalAmount*prod[3])/100;
});
calculatedAmount=parseFloat(gstTotal.toFixed(2));
}else if(productCode==="roff"){
const tempTotal=total,roffValue=Math.round(tempTotal)-tempTotal;
calculatedAmount=Math.round(roffValue*100)/100;
}

const itemData={
code:productCode,name:productName,unit,quantity,displayQuantity,newpricePerUnit,
weightPerUnit,totalWeight,finalAmount:calculatedAmount,margin,marginPercentage,marginDisplay,
marginClass:margin>=0?"margin-positive":"margin-negative"
};

const existingIndex=history.findIndex(item=>item.code===productCode);
if(existingIndex!==-1){
total-=history[existingIndex].finalAmount;
history[existingIndex]=itemData;
}else history.push(itemData);

total=parseFloat((total+calculatedAmount).toFixed(2));
renderTable();clearInput();

if(window.innerWidth<=768)document.getElementById("productInput").scrollIntoView({behavior:"smooth",block:"center"});
}

function removeProduct(productCode){
const productIndex=history.findIndex(item=>item.code===productCode);
if(productIndex===-1){alert("Product not found!");return;}
const removedItem=history.splice(productIndex,1)[0];
total-=removedItem.finalAmount;
renderTable();
}

function renderTable(){
const outputTableBody=document.getElementById("output");
outputTableBody.innerHTML="";
let calculatedTotal=0,gstTotal=0,totalMargin=0,totalWeight=0;

history.forEach(item=>{
if(!["cgst","sgst","igst","roff"].includes(item.code)){
calculatedTotal+=item.finalAmount;
totalWeight+=parseFloat(item.totalWeight)||0;
const productInfo=products[item.code];
if(productInfo&&productInfo[3])gstTotal+=(item.finalAmount*productInfo[3])/100;
if(productInfo&&productInfo[4]>0)totalMargin+=item.margin;
}
});

totalWeight=parseFloat(totalWeight.toFixed(2));
let newHistory=[];

history.forEach(item=>{
if(item.code==="cgst"||item.code==="sgst"){
item.finalAmount=parseFloat((gstTotal/2).toFixed(2));newHistory.push(item);
}else if(item.code==="igst"){
item.finalAmount=parseFloat(gstTotal.toFixed(2));newHistory.push(item);
}else if(item.code==="roff"){
const tempTotal=calculatedTotal+gstTotal,roffValue=Math.round(tempTotal)-tempTotal;
item.finalAmount=Math.round(roffValue*100)/100;newHistory.push(item);
}else newHistory.push(item);
});

history=newHistory;
let finalTotal=0;

history.forEach(item=>{
outputTableBody.insertAdjacentHTML("beforeend",`<tr><td>${item.name}</td><td>${item.displayQuantity}</td><td>${item.newpricePerUnit}</td><td>${item.finalAmount.toFixed(2)}</td><td class="${item.marginClass}">${item.marginDisplay||""}</td></tr>`);
finalTotal+=item.finalAmount;
});

const totalMarginPercentage=totalMargin>0?parseFloat((totalMargin/(finalTotal-totalMargin)*100).toFixed(2)):0;

outputTableBody.insertAdjacentHTML("beforeend",`<tr><td colspan="3" style="text-align:right;font-weight:bold">Total${totalWeight>0?` (${totalWeight} kg)`:""}</td><td style="font-weight:bold">₹${finalTotal.toFixed(2)}</td><td class="${totalMargin>=0?"margin-positive":"margin-negative"}" style="font-weight:bold">₹${totalMargin.toFixed(2)} (${totalMarginPercentage}%)</td></tr>`);

total=parseFloat(finalTotal.toFixed(2));
}

function clearAll(){
total=0;history=[];document.getElementById("output").innerHTML="";
}

function clearInput(){
const input=document.getElementById("productInput");
input.value="";input.focus();
}

async function generateImprovedPDF(){
generateBillNumber();
const {jsPDF}=window.jspdf;
const party=document.getElementById("partyInfo").value.trim()||"";
const paymentInfo=document.getElementById("paymentInfo").value;

const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
const now=new Date();
const hours=String(now.getHours()).padStart(2,"0"),minutes=String(now.getMinutes()).padStart(2,"0");
const formattedTime=`${hours}:${minutes}`,billNoText=String(billNumber).padStart(4,"0");

let pdfTotalWeight=0;
history.forEach(item=>{
if(!["cgst","sgst","igst","roff"].includes(item.code))pdfTotalWeight+=parseFloat(item.totalWeight)||0;
});
pdfTotalWeight=parseFloat(pdfTotalWeight.toFixed(2));

doc.setFont("helvetica","bold");
doc.setFontSize(16);
doc.setTextColor(0,102,153);
doc.text("Sameer Enterprises",105,10,{align:"center"});
doc.setFont("helvetica","normal");
doc.setFontSize(11);
doc.setTextColor(60);
doc.text("Opp HP Pump & HDFC Bank, LBS Road, Vikhroli (W), Mumbai - 79",105,16,{align:"center"});
doc.text("Mail: salarindiacorp@gmail.com",105,21,{align:"center"});

doc.setFont("helvetica","bold");
doc.setFontSize(22);
doc.setTextColor(40,40,140);
doc.text("Proforma Invoice",105,38,{align:"center"});

doc.setFontSize(12);
doc.setTextColor(0);
doc.setFont("helvetica","normal");
doc.text(`Bill No: ${billNoText}`,15,33);
doc.text(`Date: ${new Date().toLocaleDateString("en-GB")}`,150,33);
doc.text(`Time: ${formattedTime}`,150,38);
doc.text("Customer Info:",15,45);
doc.text(`${party}`,48,45);

let y=50;
doc.setFillColor(230,230,250);
doc.rect(10,y,180,10,"F");
doc.setFontSize(12);
doc.setTextColor(0);
doc.setFont("helvetica","bold");
doc.text("Product",15,y+7);
doc.text("Qty",100,y+7);
doc.text("Rate",135,y+7);
doc.text("Total",170,y+7);

y+=16;
const rowHeight=10;
doc.setFont("helvetica","normal");

history.forEach((item,index)=>{
if(index%2===1){
doc.setFillColor(245,245,245);
doc.rect(10,y-6,180,rowHeight,"F");
}
doc.setTextColor(0);

// PDF should show only the original quantity/unit.
// Bundle information and weight remain visible on the webpage only.
const pdfQuantity=item.quantity==1&&item.unit===""?"":`${item.quantity} ${item.unit}`;

doc.text(String(item.name),15,y);
doc.text(String(pdfQuantity),100,y);
doc.text(String(item.newpricePerUnit),135,y);
doc.text(String(item.finalAmount.toFixed(2)),170,y);
y+=rowHeight;
});

y-=rowHeight/2;
doc.setDrawColor(150,150,150);
doc.line(10,y,190,y);
doc.setFont("helvetica","bold");
doc.setFontSize(14);
doc.setTextColor(0);

const totalLabel=pdfTotalWeight>0?`Total (${pdfTotalWeight} kg)`:"Total";
doc.text(totalLabel,125,y+8);
doc.text(`${total.toFixed(2)}`,170,y+8);

y+=20;
doc.setFontSize(11);
doc.setTextColor(80);
const formattedInfo=paymentInfo.replace(/, /g,"\n");

if(paymentInfo.includes("sflenterprises1@oksbi")){
doc.setFont("helvetica","normal");
doc.setFontSize(12);
doc.text(formattedInfo.split("\n"),135,y);
const qr=new QRious({value:`upi://pay?pa=sflenterprises1@oksbi&pn=SFL%20Enterprises&am=${total}&cu=INR`,size:80});
const qrDataURL=qr.toDataURL();
y+=8;
doc.addImage(qrDataURL,"PNG",150,y,30,30);
}else if(paymentInfo.includes("Sameer Enterprises")){
doc.setFont("helvetica","normal");
doc.setFontSize(12);
doc.text(formattedInfo.split("\n"),135,y);
const qr=new QRious({value:`upi://pay?pa=salarindiacorp@okhdfcbank&pn=Latif%20Chaudhary&am=${total}&cu=INR`,size:80});
const qrDataURL=qr.toDataURL();
y+=24;
doc.addImage(qrDataURL,"PNG",150,y,30,30);
}else{
doc.setFont("helvetica","normal");
doc.setFontSize(12);
doc.text(formattedInfo.split("\n"),135,y);
}

doc.save(`${billNoText}.pdf`);

if(!party&&history.length===0){alert("Cannot save empty bill!");return;}

const billData={id:Date.now(),billNumber:billNumber,party:party,items:history,total:total};
let savedBills=JSON.parse(localStorage.getItem("savedBills"))||[];
savedBills.unshift(billData);
if(savedBills.length>100)savedBills=savedBills.slice(0,100);

try{
localStorage.setItem("savedBills",JSON.stringify(savedBills));
}catch(e){
alert("Storage is full! Please delete some old bills.");
}

renderSavedBills();
showNextBillNumber();
}

function renderSavedBills(){
const billList=document.getElementById("billList");
billList.innerHTML="";
let savedBills=JSON.parse(localStorage.getItem("savedBills"))||[];

savedBills.forEach(bill=>{
const li=document.createElement("li");
li.style.display="flex";
li.style.justifyContent="space-between";
li.style.alignItems="center";
li.style.padding="5px 0";
li.style.borderBottom="1px solid #ccc";

const billText=document.createElement("span");
const billDate=new Date(bill.id);
const dateStr=billDate.toLocaleDateString("en-GB");
const timeStr=billDate.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});

billText.textContent=`${String(bill.billNumber).padStart(4,"0")}_${dateStr}_${timeStr}_${bill.party||"Unnamed"}_${bill.total.toFixed(2)}`;
billText.style.cursor="pointer";
billText.addEventListener("click",()=>loadBill(bill.id));

const deleteBtn=document.createElement("button");
deleteBtn.textContent="❌";
deleteBtn.style.marginLeft="10px";
deleteBtn.style.cursor="pointer";
deleteBtn.style.border="none";
deleteBtn.style.background="transparent";
deleteBtn.style.color="red";
deleteBtn.style.fontSize="16px";
deleteBtn.addEventListener("click",e=>{e.stopPropagation();deleteBill(bill.id)});

li.appendChild(billText);
li.appendChild(deleteBtn);
billList.appendChild(li);
});
}

function loadBill(billId){
let savedBills=JSON.parse(localStorage.getItem("savedBills"))||[];
const bill=savedBills.find(b=>b.id===billId);
if(!bill){alert("Bill not found!");return;}

document.getElementById("partyInfo").value=bill.party;
history=bill.items;
total=bill.total;

history.forEach(item=>{
const productDetails=products[item.code]||customProducts[item.code];
if(!productDetails)return;

if(item.weightPerUnit===undefined)item.weightPerUnit=parseFloat(productDetails[5])||0;
if(item.totalWeight===undefined)item.totalWeight=parseFloat((item.quantity*item.weightPerUnit).toFixed(2));

if(!item.displayQuantity||!item.displayQuantity.includes("kg")){
const unit=productDetails[1];
const bundleSize=parseFloat(productDetails[6])||0;

item.displayQuantity=item.quantity==1&&unit===""?"":`${item.quantity} ${unit}`;

if(bundleSize>0 && unit==="nos" && item.displayQuantity!==""){
    const fullBundles=Math.floor(item.quantity/bundleSize);
    const remainingNos=parseFloat((item.quantity%bundleSize).toFixed(2));

    if(fullBundles>0){
        item.displayQuantity+=` (${fullBundles}b${remainingNos>0?` ${remainingNos}n`:""})`;
    }
}

if(item.weightPerUnit>0&&item.displayQuantity!=="")item.displayQuantity+=` (${item.totalWeight} kg)`;
}
});

renderTable();
}

function deleteBill(billId){
let savedBills=JSON.parse(localStorage.getItem("savedBills"))||[];
savedBills=savedBills.filter(b=>b.id!==billId);
localStorage.setItem("savedBills",JSON.stringify(savedBills));
renderSavedBills();
}

function handleEnter(event){
if(event.key==="Enter")addProduct();
}

document.getElementById("productInput").addEventListener("input",showProductInfo);

function showProductInfo(){
const input=document.getElementById("productInput").value.trim();
const preview=document.getElementById("productInfoPreview");
if(!input.includes(" ")){preview.textContent="";return;}

const parts=input.split(" ");
const productCode=parts.length===2?parts[1]:parts.length===3?parts[1]:"";
if(!productCode){preview.textContent="";return;}

const product=products[productCode]||customProducts[productCode];
if(product){
const weight=parseFloat(product[5])||0;
preview.textContent=weight>0?`${product[0]} — ${weight} kg/unit`:product[0];
}else preview.textContent="";
}

const inputField=document.getElementById("productInput");
const suggestionList=document.getElementById("suggestionList");

inputField.addEventListener("input",()=>{
const query=inputField.value.trim().toLowerCase();
suggestionList.innerHTML="";
if(!query)return;

let suggestions;
if(query.startsWith("/")){
const nameQuery=query.slice(1);
suggestions=Object.entries(products).filter(([code,[name]])=>name.toLowerCase().includes(nameQuery));
}else{
suggestions=Object.entries(products).filter(([code])=>code.toLowerCase().includes(query));
}

suggestions.slice(0,10).forEach(([code,product])=>{
const name=product[0],unit=product[1],price=product[2],weight=parseFloat(product[5])||0;
const item=document.createElement("li");
item.textContent=weight>0?`${code} - ${name} (₹${price}) (${weight} kg/unit)`:`${code} - ${name} (₹${price})`;
item.style.padding="5px 10px";
item.style.cursor="pointer";
item.addEventListener("click",()=>{
inputField.value=`${code} `;
suggestionList.innerHTML="";
inputField.focus();
showProductInfo();
});
suggestionList.appendChild(item);
});
});

document.addEventListener("click",e=>{
if(!document.getElementById("suggestions").contains(e.target))suggestionList.innerHTML="";
});

window.addEventListener("DOMContentLoaded",()=>{
renderSavedBills();
showNextBillNumber();
});
</script>
</body>
</html>
