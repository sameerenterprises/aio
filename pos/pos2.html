<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Proforma Invoice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 90%;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    input {
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: calc(100% - 22px);
    }
    .input-group {
      margin-bottom: 20px;
    }
    #outputTable, #productReferenceTable {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    #outputTable th, #outputTable td, #productReferenceTable th, #productReferenceTable td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      word-wrap: break-word;
      white-space: normal;
    }
    #outputTable th, #productReferenceTable th {
      background-color: #f2f2f2;
    }
    .reference-container {
      margin-top: 20px;
      padding: 20px;
      background-color: #fff;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .margin-positive {
      color: green;
    }
    .margin-negative {
      color: red;
    }
  </style>
</head>

    function generateBillNumber() {
      // Get last used bill number from localStorage
      const lastBillNumber = parseInt(localStorage.getItem("lastBillNumber") || "0", 10);
      const newBillNumber = lastBillNumber + 1;
      localStorage.setItem("lastBillNumber", newBillNumber);
      billNumber = newBillNumber;
      document.getElementById("billNumberDisplay").textContent = `Bill Number: ${String(billNumber).padStart(4, '0')}`;
    }
    
    function showNextBillNumber() {
      const lastBillNumber = parseInt(localStorage.getItem("lastBillNumber") || "0", 10);
      document.getElementById("billNumberDisplay").textContent = `Bill Number: ${String(lastBillNumber + 1).padStart(4, '0')}`;
    }

    function getActualCostPrice(productDetails) {
      const costPrice = parseFloat(productDetails[4]) || 0;
      const gstPercentage = parseFloat(productDetails[3]) || 0;
    
      const gstMode = document.getElementById("gstMode").checked;
    
      if (gstMode) {
        // GST ON:
        // Base cost price is treated as the actual cost price
        return costPrice;
      } else {
        // GST OFF:
        // Cost price + GST is treated as the actual cost price
        return costPrice + (costPrice * gstPercentage / 100);
      }
    }

  function recalculateAllMargins() {
    history.forEach(item => {
      const productDetails = products[item.code] || customProducts[item.code];

      // Ignore GST/round-off rows.
      if (!productDetails || ["cgst", "sgst", "igst", "roff"].includes(item.code)) {
        return;
      }

      const costPrice = parseFloat(productDetails[4]) || 0;
      const sellingRate = parseFloat(item.newpricePerUnit) || 0;

      // Margin = selling rate - cost price from products[][4].
      const marginPerUnit = sellingRate - costPrice;

      item.margin = parseFloat(marginPerUnit.toFixed(2));
      item.marginPercentage = costPrice > 0
        ? parseFloat(((marginPerUnit / costPrice) * 100).toFixed(2))
        : 0;

      item.marginDisplay = costPrice > 0
        ? `₹${item.margin.toFixed(2)} (${item.marginPercentage}%)`
        : `₹${item.margin.toFixed(2)}`;

      item.marginClass =
        item.margin >= 0 ? "margin-positive" : "margin-negative";
    });

    renderTable();
  }

  document.getElementById("gstMode").addEventListener("change", function () {
    recalculateAllMargins();
  });

    function addProduct() {
      const input = document.getElementById("productInput").value.trim().replace(/ /g, '*');

      if (input === "c") {
        clearAll();
        return;
      }

      if (input.startsWith('*')) {
        const customProductName = input.slice(1);
        if (customProductName) {
          customProducts[customProductName] = [customProductName, "nos", 0, 0, 0];
          alert(`Custom product "${customProductName}" added. Now enter quantity and rate in the format: quantity*${customProductName}*rate`);
        }
        clearInput();
        return;
      }

      const [productCode, quantityStr, amountStr] = input.split("*");
      const quantity = quantityStr
        ? parseFloat(parseFloat(quantityStr).toFixed(2))
        : 1;

      let amount = 0;
      let isInclusiveGST = false;

      if (amountStr) {
        if (amountStr.toLowerCase().endsWith("i")) {
          isInclusiveGST = true;
          amount = parseFloat(amountStr.slice(0, -1));
        } else {
          amount = parseFloat(amountStr);
        }

        amount = parseFloat((amount || 0).toFixed(2));
      }

      const productDetails = products[productCode] || customProducts[productCode];

      if (!productDetails) {
        alert("Invalid product code!");
        clearInput();
        return;
      }

      if (quantity === 0) {
        removeProduct(productCode);
        clearInput();
        return;
      }

      const productName = productDetails[0];
      const unit = productDetails[1];
      const basicRate = parseFloat(productDetails[2]) || 0;
      const gstPercentage = parseFloat(productDetails[3]) || 0;
      const costPrice = parseFloat(productDetails[4]) || 0;

      // The stored/displayed Rate is always the GST-exclusive/base selling rate.
      // If the user enters "i", the entered amount is treated as GST-inclusive
      // and converted back to the base rate.
      let pricePerUnit;

      if (amount === 0) {
        pricePerUnit = basicRate;
      } else if (isInclusiveGST) {
        pricePerUnit = parseFloat(
          (amount / (1 + gstPercentage / 100)).toFixed(2)
        );
      } else {
        pricePerUnit = amount;
      }

      const rateWithGST = parseFloat(
        (pricePerUnit * (1 + gstPercentage / 100)).toFixed(2)
      );

      // IMPORTANT:
      // Total is ALWAYS Quantity × Rate Incl GST.
      const finalAmount = parseFloat(
        (quantity * rateWithGST).toFixed(2)
      );

      // IMPORTANT:
      // Margin is ALWAYS Selling Rate - COST PRICE from products[] [4].
      const marginPerUnit = parseFloat(
        (pricePerUnit - costPrice).toFixed(2)
      );

      const marginPercentage = costPrice > 0
        ? parseFloat(((marginPerUnit / costPrice) * 100).toFixed(2))
        : 0;

      const marginDisplay = costPrice > 0
        ? `₹${marginPerUnit.toFixed(2)} (${marginPercentage}%)`
        : `₹${marginPerUnit.toFixed(2)}`;

      const newpricePerUnit =
        quantity == 1 && unit == "" ? "" : `${pricePerUnit}`;

      const displayQuantity =
        quantity == 1 && unit == "" ? "" : `${quantity}`;

      let calculatedAmount = finalAmount;

      // Keep the existing special GST/round-off commands.
      if (productCode === "cgst" || productCode === "sgst") {
        let gstTotal = 0;

        history.forEach(item => {
          const prod = products[item.code] || customProducts[item.code];
          if (
            prod &&
            !["cgst", "sgst", "igst", "roff"].includes(item.code)
          ) {
            const baseAmount =
              (parseFloat(item.newpricePerUnit) || 0) *
              (parseFloat(item.quantity) || 1);
            const itemGST = parseFloat(prod[3]) || 0;
            gstTotal += (baseAmount * itemGST) / 100;
          }
        });

        calculatedAmount = parseFloat((gstTotal / 2).toFixed(2));

      } else if (productCode === "igst") {
        let gstTotal = 0;

        history.forEach(item => {
          const prod = products[item.code] || customProducts[item.code];
          if (
            prod &&
            !["cgst", "sgst", "igst", "roff"].includes(item.code)
          ) {
            const baseAmount =
              (parseFloat(item.newpricePerUnit) || 0) *
              (parseFloat(item.quantity) || 1);
            const itemGST = parseFloat(prod[3]) || 0;
            gstTotal += (baseAmount * itemGST) / 100;
          }
        });

        calculatedAmount = parseFloat(gstTotal.toFixed(2));

      } else if (productCode === "roff") {
        const roffValue = Math.round(total) - total;
        calculatedAmount = parseFloat(roffValue.toFixed(2));
      }

      const existingIndex = history.findIndex(item => item.code === productCode);

      const itemData = {
        code: productCode,
        name: productName,
        unit,
        quantity,
        displayQuantity,
        newpricePerUnit,
        rateWithGST,
        finalAmount: calculatedAmount,
        margin: marginPerUnit,
        marginPercentage,
        marginDisplay,
        marginClass: marginPerUnit >= 0 ? "margin-positive" : "margin-negative"
      };

      if (existingIndex !== -1) {
        const existingItem = history[existingIndex];
        total -= existingItem.finalAmount;
        history[existingIndex] = itemData;
      } else {
        history.push(itemData);
      }

      total = parseFloat((total + calculatedAmount).toFixed(2));

      renderTable();
      clearInput();

      if (window.innerWidth <= 768) {
        document.getElementById("productInput").scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }
    }

    function removeProduct(productCode) {
      const productIndex = history.findIndex(item => item.code === productCode);
      if (productIndex === -1) {
        alert("Product not found!");
        return;
      }
 
      const removedItem = history.splice(productIndex, 1)[0];
      total -= removedItem.finalAmount;

      renderTable();
    }

    function renderTable() {
      const outputTableBody = document.getElementById("output");
      outputTableBody.innerHTML = "";

      let finalTotal = 0;
      let totalMargin = 0;

      history.forEach(item => {
        const isSpecialRow = ["cgst", "sgst", "igst", "roff"].includes(item.code);

        if (!isSpecialRow) {
          const productInfo = products[item.code] || customProducts[item.code];
          const gst = productInfo ? (parseFloat(productInfo[3]) || 0) : 0;
          const rate = parseFloat(item.newpricePerUnit) || 0;

          // Rate Incl GST is calculated from the displayed/base selling rate.
          const rateInclGST = parseFloat(
            (rate * (1 + gst / 100)).toFixed(2)
          );

          // Total is ALWAYS quantity × rate incl GST.
          const quantity = parseFloat(item.quantity) || 1;
          const rowTotal = parseFloat(
            (quantity * rateInclGST).toFixed(2)
          );

          // Keep stored values synchronized.
          item.rateWithGST = rateInclGST;
          item.finalAmount = rowTotal;

          // Margin is ALWAYS selling rate - COST PRICE from products[] [4].
          const costPrice = productInfo
            ? (parseFloat(productInfo[4]) || 0)
            : 0;

          const margin = parseFloat((rate - costPrice).toFixed(2));
          const marginPercentage = costPrice > 0
            ? parseFloat(((margin / costPrice) * 100).toFixed(2))
            : 0;

          item.margin = margin;
          item.marginPercentage = marginPercentage;
          item.marginDisplay = costPrice > 0
            ? `₹${margin.toFixed(2)} (${marginPercentage}%)`
            : `₹${margin.toFixed(2)}`;
          item.marginClass =
            margin >= 0 ? "margin-positive" : "margin-negative";

          totalMargin += margin;
          finalTotal += rowTotal;

          outputTableBody.insertAdjacentHTML("beforeend", `
            <tr>
              <td>${item.name}</td>
              <td>${item.displayQuantity} ${item.unit}</td>
              <td>₹${rate.toFixed(2)}</td>
              <td>₹${rateInclGST.toFixed(2)}</td>
              <td>₹${rowTotal.toFixed(2)}</td>
              <td class="${item.marginClass}">${item.marginDisplay || ""}</td>
            </tr>
          `);
        } else {
          // Special GST/round-off rows remain available.
          const specialAmount = parseFloat(item.finalAmount) || 0;

          outputTableBody.insertAdjacentHTML("beforeend", `
            <tr>
              <td>${item.name}</td>
              <td>${item.displayQuantity || ""} ${item.unit || ""}</td>
              <td>—</td>
              <td>—</td>
              <td>₹${specialAmount.toFixed(2)}</td>
              <td></td>
            </tr>
          `);

          finalTotal += specialAmount;
        }
      });

      const totalMarginPercentage = finalTotal - totalMargin !== 0
        ? parseFloat(
            ((totalMargin / (finalTotal - totalMargin)) * 100).toFixed(2)
          )
        : 0;

      outputTableBody.insertAdjacentHTML("beforeend", `
        <tr>
          <td colspan="4" style="text-align: right; font-weight: bold;">Total</td>
          <td style="font-weight: bold;">₹${finalTotal.toFixed(2)}</td>
          <td class="${totalMargin >= 0 ? 'margin-positive' : 'margin-negative'}" style="font-weight: bold;">
            ₹${totalMargin.toFixed(2)} (${totalMarginPercentage}%)
          </td>
        </tr>
      `);

      total = parseFloat(finalTotal.toFixed(2));
    }

    function clearAll() {
      total = 0;
      history = [];
      document.getElementById("output").innerHTML = "";
    }

      const input = document.getElementById("productInput");

    async function generateImprovedPDF() {
      // ✅ Generate a new bill number when PDF is created
      generateBillNumber();
    
      const { jsPDF } = window.jspdf;
      const party = document.getElementById("partyInfo").value.trim() || "";
      const paymentInfo = document.getElementById("paymentInfo").value;
    
      const doc = new jsPDF({
        orientation: "portrait",
        unit: "mm",
        format: "a4",
      });
    
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const formattedTime = `${hours}:${minutes}`;
      const billNoText = `${String(billNumber).padStart(4, '0')}`;
    
      // ✅ Company Info Header
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.setTextColor(0, 102, 153);
      doc.text("Sameer Enterprises", 105, 10, { align: "center" });
    
      doc.setFont("helvetica", "normal");
      doc.setFontSize(11);
      doc.setTextColor(60);
      doc.text("Opp HP Pump & HDFC Bank, LBS Road, Vikhroli (W), Mumbai - 79", 105, 16, { align: "center" });
      doc.text("Mail: salarindiacorp@gmail.com", 105, 21, { align: "center" });
      // doc.text("Phone: 7045692083", 105, 26, { align: "center" });
    
      // ✅ Header
      doc.setFont("helvetica", "bold");
      doc.setFontSize(22);
      doc.setTextColor(40, 40, 140);
      doc.text("Proforma Invoice", 105, 38, { align: "center" });
    
      // ✅ Metadata (Bill No, Date, Time, Info)
      doc.setFontSize(12);
      doc.setTextColor(0);
      doc.setFont("helvetica", "normal");
      doc.text(`Bill No: ${billNoText}`, 15, 33);
      doc.text(`Date: ${new Date().toLocaleDateString('en-GB')}`, 150, 33);
      doc.text(`Time: ${formattedTime}`, 150, 38);
      doc.text(`Customer Info:`, 15, 45);
      doc.setFont("helvetica", "normal");
      doc.text(`${party}`, 48, 45);
    
      // ✅ Table Header
      let y = 50;
      doc.setFillColor(230, 230, 250);
      doc.rect(10, y, 180, 10, 'F');
      doc.setFontSize(12);
      doc.setTextColor(0);
      doc.setFont("helvetica", "bold");
      doc.text("Product", 15, y + 7);
      doc.text("Qty", 100, y + 7);
      doc.text("Rate", 125, y + 7);
      doc.text("Rate Incl GST", 145, y + 7);
      doc.text("Total", 180, y + 7);
    
      // ✅ Table Body
      y += 16;
      const rowHeight = 10;
      doc.setFont("helvetica", "normal");
    
      history.forEach((item, index) => {
        if (index % 2 === 1) {
          doc.setFillColor(245, 245, 245);
          doc.rect(10, y - 6, 180, rowHeight, 'F');
        }
        doc.setTextColor(0);
        doc.text(String(item.name), 15, y);
        doc.text(String(item.displayQuantity + " " + item.unit), 100, y);
        const productInfo = products[item.code] || customProducts[item.code];
        const gst = productInfo ? (parseFloat(productInfo[3]) || 0) : 0;
        const rate = parseFloat(item.newpricePerUnit) || 0;
        const rateInclGST = parseFloat(
          (rate * (1 + gst / 100)).toFixed(2)
        );
        const quantity = parseFloat(item.quantity) || 1;
        const rowTotal = ["cgst", "sgst", "igst", "roff"].includes(item.code)
          ? (parseFloat(item.finalAmount) || 0)
          : parseFloat((quantity * rateInclGST).toFixed(2));

        doc.text(String(rate.toFixed(2)), 125, y);
        doc.text(String(rateInclGST.toFixed(2)), 145, y);
        doc.text(String(rowTotal.toFixed(2)), 180, y);
        y += rowHeight;
      });
    
      y -= rowHeight / 2;
    
      // ✅ Total Section
      doc.setDrawColor(150, 150, 150);
      doc.line(10, y, 190, y);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(14);
      doc.setTextColor(0);
      doc.text("Total", 135, y + 8);
      doc.text(`${total}`, 170, y + 8);
    
      // ✅ Footer with Payment Info + QR
      y += 20;
      doc.setFontSize(11);
      doc.setTextColor(80);
    
      const formattedInfo = paymentInfo.replace(/, /g, "\n");
    
      if (paymentInfo.includes("sflenterprises1@oksbi")) {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(12);
        doc.text(formattedInfo.split("\n"), 135, y);
        const qr = new QRious({
          value: `upi://pay?pa=sflenterprises1@oksbi&pn=SFL%20Enterprises&am=${total}&cu=INR`,
          size: 80,
        });
        const qrDataURL = qr.toDataURL();
        y += 8;
        doc.addImage(qrDataURL, "PNG", 150, y, 30, 30);
      } else if (paymentInfo.includes("Sameer Enterprises")) {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(12);
        doc.text(formattedInfo.split("\n"), 135, y);
        const qr = new QRious({
          value: `upi://pay?pa=salarindiacorp@okhdfcbank&pn=Latif%20Chaudhary&am=${total}&cu=INR`,
          size: 80,
        });
        const qrDataURL = qr.toDataURL();
        y += 24;
        doc.addImage(qrDataURL, "PNG", 150, y, 30, 30);
      } else {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(12);
        doc.text(formattedInfo.split("\n"), 135, y);
      }
    
      // ✅ Save PDF with Bill Number
      doc.save(`${billNoText}.pdf`);

    
      // ✅ Save bill to localStorage
      if (!party && history.length === 0) {
        alert("Cannot save empty bill!");
        return;
      }
    
      const billData = {
        id: Date.now(),
        billNumber: billNumber,
        party: party,
        items: history,
        total: total
      };
    
      let savedBills = JSON.parse(localStorage.getItem("savedBills")) || [];
      savedBills.unshift(billData);
    
      if (savedBills.length > 100) {
        savedBills = savedBills.slice(0, 100);
      }
    
      try {
        localStorage.setItem("savedBills", JSON.stringify(savedBills));
      } catch (e) {
        alert("Storage is full! Please delete some old bills.");
      }
    
      // ✅ Refresh saved bills list immediately
      renderSavedBills();
      showNextBillNumber();
    }

    
    function renderSavedBills() {
      const billList = document.getElementById("billList");
      billList.innerHTML = "";
    
      let savedBills = JSON.parse(localStorage.getItem("savedBills")) || [];
    
      savedBills.forEach(bill => {
        const li = document.createElement("li");
        li.style.display = "flex";
        li.style.justifyContent = "space-between";
        li.style.alignItems = "center";
        li.style.padding = "5px 0";
        li.style.borderBottom = "1px solid #ccc";
    
        // Bill name
        const billText = document.createElement("span");
    
        // Format date and time from bill.id (timestamp)
        const billDate = new Date(bill.id);
        const dateStr = billDate.toLocaleDateString("en-GB"); // dd/mm/yyyy
        const timeStr = billDate.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    
        // 👇 Add bill number here (permanent)
        billText.textContent = `${String(bill.billNumber).padStart(4, '0')}_${dateStr}_${timeStr}_${bill.party || "Unnamed"}_${bill.total.toFixed(2)}`;
            
        billText.style.cursor = "pointer";
        billText.addEventListener("click", () => {
          loadBill(bill.id);
        });
    
        // Delete button
        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "❌";
        deleteBtn.style.marginLeft = "10px";
        deleteBtn.style.cursor = "pointer";
        deleteBtn.style.border = "none";
        deleteBtn.style.background = "transparent";
        deleteBtn.style.color = "red";
        deleteBtn.style.fontSize = "16px";
    
        deleteBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteBill(bill.id);
        });
    
        li.appendChild(billText);
        li.appendChild(deleteBtn);
    
        billList.appendChild(li);
      });
    }

    
    function loadBill(billId) {
      let savedBills = JSON.parse(localStorage.getItem("savedBills")) || [];
      const bill = savedBills.find(b => b.id === billId);
    
      if (!bill) {
        alert("Bill not found!");
        return;
      }
    
      document.getElementById("partyInfo").value = bill.party;
      history = bill.items;
      total = bill.total;
    
      renderTable();
    }
    
    function deleteBill(billId) {
      let savedBills = JSON.parse(localStorage.getItem("savedBills")) || [];
      savedBills = savedBills.filter(b => b.id !== billId);
    
      localStorage.setItem("savedBills", JSON.stringify(savedBills));
      renderSavedBills();
    }

    function handleEnter(event) {
      if (event.key === "Enter") {
        addProduct();
      }
    }
    
    document.getElementById("productInput").addEventListener("input", showProductInfo);

    function showProductInfo() {
      const input = document.getElementById("productInput").value.trim();
      const preview = document.getElementById("productInfoPreview");
    
      if (!input.includes(" ")) {
        preview.textContent = "";
        return;
      }
    
      const parts = input.split(" ");
      const productCode = parts.length === 2 ? parts[1] : (parts.length === 3 ? parts[1] : "");
    
      if (!productCode) {
        preview.textContent = "";
        return;
      }
    
      const product = products[productCode] || customProducts[productCode];
    }

    const inputField = document.getElementById("productInput");
    const suggestionList = document.getElementById("suggestionList");
    
    inputField.addEventListener("input", () => {
      const query = inputField.value.trim().toLowerCase();
      suggestionList.innerHTML = "";
    
      if (!query) return;
    
      let suggestions;
    
      if (query.startsWith("/")) {
        // Search by product name (excluding the '/')
        const nameQuery = query.slice(1);
        suggestions = Object.entries(products).filter(([code, [name]]) =>
          name.toLowerCase().includes(nameQuery)
        );
      } else {
        // Search by product code
        suggestions = Object.entries(products).filter(([code]) =>
          code.toLowerCase().includes(query)
        );
      }

      suggestions.slice(0, 10).forEach(([code, [name, unit, price]]) => {
        const item = document.createElement("li");
        item.textContent = `${code} - ${name} (₹${price})`;
        item.style.padding = "5px 10px";
        item.style.cursor = "pointer";
    
        item.addEventListener("click", () => {
          inputField.value = `${code} `;
          suggestionList.innerHTML = "";
          inputField.focus();
          showProductInfo();
        });
    
        suggestionList.appendChild(item);
      });
    });

    // Hide suggestions when clicking outside
    document.addEventListener("click", function (e) {
      if (!document.getElementById("suggestions").contains(e.target)) {
        suggestionList.innerHTML = "";
      }
    });
    
    // 👇 Restore saved bills on page load
    window.addEventListener("DOMContentLoaded", () => {
      renderSavedBills();
        showNextBillNumber();
    });

  </script>
</body>
</html>
